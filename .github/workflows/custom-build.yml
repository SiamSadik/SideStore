name: Custom SideStore IPA Build

# Builds SideStore.ipa (ad-hoc signed) from the current branch using GitHub's
# macOS runners — no local Mac required. Install the artifact with iLoader
# (iLoader re-signs with your Apple ID during install).

on:
  workflow_dispatch:
  push:
    branches: [fix-ios27, stable-export]

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install tooling
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      # The em_proxy submodule's fetch-prebuilt.sh pulls assets from
      # SideStore/em_proxy's *latest* release. The stable-era build (pinned
      # submodule 816dc733, pre-rework API) needs the old-format assets, but
      # the latest release (v0.9.2) ships a new-format xcframework, so the
      # wget 404s and clobbers em_proxy.swift with an empty file. Restore the
      # correct assets from the old-format "build" release and make
      # fetch-prebuilt.sh skip its download.
      - name: Restore stable em_proxy prebuilt assets
        run: |
          cd Dependencies/em_proxy
          touch .skip-prebuilt-fetch-em_proxy
          curl -fsSL -o em_proxy.h "https://github.com/SideStore/em_proxy/releases/download/build/em_proxy.h"
          curl -fsSL -o em_proxy.swift "https://github.com/SideStore/em_proxy/releases/download/build/em_proxy.swift"
          curl -fsSL -o libem_proxy-ios.a "https://github.com/SideStore/em_proxy/releases/download/build/libem_proxy-ios.a"
          curl -fsSL -o libem_proxy-sim.a "https://github.com/SideStore/em_proxy/releases/download/build/libem_proxy-sim.a"

      - name: Build
        run: |
          set -o pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | xcbeautify
          make fakesign
          make ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-custom.ipa
          path: SideStore.ipa

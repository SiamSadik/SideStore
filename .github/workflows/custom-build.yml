name: Custom SideStore IPA Build

# Builds SideStore.ipa (ad-hoc signed) from the current branch using GitHub's
# macOS runners — no local Mac required. Install the artifact with iLoader
# (iLoader re-signs with your Apple ID during install).

on:
  workflow_dispatch:
  push:
    branches: [fix-ios27]

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install tooling
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build
        run: |
          set -o pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | xcbeautify
          make fakesign
          make ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-custom.ipa
          path: SideStore.ipa

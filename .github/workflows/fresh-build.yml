name: Fresh Dev Build (2026-09-03 upstream develop)

on:
  workflow_dispatch:
  push:
    branches: [fresh-dev-0903]

concurrency:
  group: fresh-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install tooling
        run: brew install ldid xcbeautify

      - name: Build
        run: |
          build_one() { NSUnbufferedIO=YES make -B build > build-raw.log 2>&1; }
          set +e
          build_one; RC=$?
          if [ $RC -ne 0 ]; then
            echo "attempt 1 failed ($RC) - clearing SPM cache and retrying once"
            rm -rf ~/Library/Caches/org.swift.swiftpm
            build_one; RC=$?
          fi
          set -e
          if [ $RC -ne 0 ]; then echo "===== RAW TAIL ====="; tail -80 build-raw.log; exit $RC; fi
          make fakesign
          make ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-fresh.ipa
          path: SideStore.ipa
